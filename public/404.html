<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const path = window.location.pathname;
      const base = '/personal-portfolio';

      sessionStorage.setItem(
        'redirect',
        path.slice(base.length) + window.location.search + window.location.hash
      );

      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
